# The `model.after` goal-tokens hook: after every model call, recompute
# cumulative input+output token usage from the session's events.jsonl
# and write it into the goal state file so the TUI goal row reflects
# live usage (docs/goal-ux.md §1.6, docs/auto-compact-plan.md §4.6).
#
# Bootstrap split (docs/tui-ext-repo-split.md section 4): goal mode is
# extension-owned, so the goal loop hooks live in the exts repo's
# `goal-hooks/` group.
# Standalone cargo package: the empty `[workspace]` table stops cargo
# from attaching it to an ancestor workspace.
#
# Build: `cargo build` in this directory. The binary lands in
# ./target/debug/harness-hook-goal-tokens. The loop resolves the bare
# name from config.toml's [hooks] on PATH; `ext-env.sh` puts the
# target dirs on PATH.

[package]
name = "hook-goal-tokens"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "harness-hook-goal-tokens"
path = "src/main.rs"

[dependencies]
rushi-goal-state = { path = "../../goal-state" }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
