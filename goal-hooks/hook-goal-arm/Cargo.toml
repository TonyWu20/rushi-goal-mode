# The `model.before` goal hook: while a goal is active, appends a
# cache-stable goal block (objective + goal-mode rules + trust-boundary
# framing) to every model request (docs/goal-rule-reinject.md).
#
# Bootstrap split (docs/tui-ext-repo-split.md section 4): goal mode is
# extension-owned, so the four `harness-hook-goal-*` loop hooks moved
# from the kernel `bin/` to the exts repo's `goal-hooks/` group.
# Standalone cargo package: the empty `[workspace]` table stops cargo
# from attaching it to an ancestor workspace, like the goal ext and
# the ext-rs entries.
#
# Build: `cargo build` in this directory. The binary lands in
# ./target/debug/harness-hook-goal-arm. The loop resolves the bare
# name from config.toml's [hooks] on PATH; `ext-env.sh` puts the
# target dirs on PATH.

[package]
name = "hook-goal-arm"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "harness-hook-goal-arm"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
# `goal-state` is a sibling crate in this exts repo. All goal-mode
# packages share it via a local path dep.
goal-state = { path = "../../goal-state" }

[dev-dependencies]
tempfile = "3"
