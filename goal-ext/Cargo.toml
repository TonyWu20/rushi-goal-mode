# The `goal` commands extension for the TUI command palette
# (docs/tui-command-palette.md section 10). Standalone cargo package
# (not a member of the root workspace): the empty `[workspace]` table
# stops cargo from attaching it to the root, like the mermaid ext.
#
# Build: `cargo build --release` in this directory. The binary lands
# in ./target/release/goal-ext. The manifest addresses it by a path
# relative to its own entry; the host resolves that against the entry
# directory (docs/ui-extension.md section 6), so no `PATH` export is
# required for the global layer.

[package]
name = "goal-ext"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "goal-ext"
path = "src/main.rs"

[dependencies]
# `rushi-goal-state` is a sibling crate in this goal-app repo. The goal ext
# shares it via a local path dep.
rushi-goal-state = { path = "../goal-state" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
